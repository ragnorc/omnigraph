  readonly: [act-ro]
  unprotected_writers: [act-unprot]
rules:
  - id: writers-branch-scoped
    allow:
      actors: { group: writers }
      actions: [read, export, change, maintain]
      branch_scope: any
  - id: writers-target-scoped
    allow:
      actors: { group: writers }
      actions: [branch_create, schema_apply, branch_delete, branch_merge, branch_claim, commit_publish, commit_drop]
      target_branch_scope: any
  - id: writers-unscoped
    allow:
      actors: { group: writers }
      actions: [reclaim, invoke_query]
  # Policy cell: act-ro reads only; act-unprot changes only unprotected
  # branches (not main).
  - id: readonly-read
    allow:
      actors: { group: readonly }
      actions: [read, export]
      branch_scope: any
  - id: unprot-read
    allow:
      actors: { group: unprotected_writers }
      actions: [read, export]
      branch_scope: any
  - id: unprot-change
    allow:
      actors: { group: unprotected_writers }
      actions: [change]
      branch_scope: unprotected
  - id: unprot-branch
    allow:
      actors: { group: unprotected_writers }
      actions: [branch_create]
      target_branch_scope: unprotected
