autotests = false
autobenches = false
description = "A columnar data format that is 100x faster than Parquet for random access."
readme = "README.md"
keywords = [
    "data-format",
    "data-science",
    "machine-learning",
    "apache-arrow",
    "data-analytics",
]
categories = [
    "database-implementations",
    "data-structures",
    "development-tools",
    "science",
]
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance"

